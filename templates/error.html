{% extends "base.html" %}

{% block title %}Error - BillKarma{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-5 py-20 text-center">
    <h1 class="text-xl font-bold text-gray-900 mb-2">Something went wrong</h1>
    <p class="text-sm text-gray-500 mb-6">
        {{ message | default("An unexpected error occurred. Please try again.") }}
    </p>
    <div class="flex items-center justify-center gap-3">
        <a href="/scan" class="px-4 py-2 bg-accent-700 text-white text-sm font-medium rounded-md hover:bg-accent-800 transition-colors">
            Try again
        </a>
        <a href="/" class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors">
            Go home
        </a>
    </div>
</section>
{% endblock %}
