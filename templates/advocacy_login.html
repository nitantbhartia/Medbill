<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — BillKarma Advocacy</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background: #F9FAFB; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-2 mb-2">
                <div class="w-6 h-6 bg-green-700 rounded-full"></div>
                <span class="font-bold text-lg tracking-tight">BillKarma</span>
            </div>
            <p class="text-gray-500 text-sm">Advocacy Workspace</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
            <!-- Tab switcher -->
            <div class="flex mb-6 bg-gray-100 rounded-lg p-0.5">
                <button id="tab-login" onclick="showTab('login')" class="flex-1 py-2 text-sm font-medium rounded-md transition-colors bg-white shadow-sm">Sign in</button>
                <button id="tab-register" onclick="showTab('register')" class="flex-1 py-2 text-sm font-medium rounded-md transition-colors text-gray-500">Register</button>
            </div>

            <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg"></div>

            <!-- Login form -->
            <form id="login-form" onsubmit="return handleLogin(event)">
                <div class="space-y-3">
                    <input type="email" id="login-email" placeholder="Email" required
                        class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-600 focus:border-transparent outline-none">
                    <input type="password" id="login-password" placeholder="Password" required
                        class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-600 focus:border-transparent outline-none">
                </div>
                <button type="submit" class="w-full mt-4 py-2.5 bg-gray-900 text-white text-sm font-semibold rounded-full hover:bg-gray-800 transition-colors">
                    Sign in
                </button>
            </form>

            <!-- Register form -->
            <form id="register-form" onsubmit="return handleRegister(event)" class="hidden">
                <div class="space-y-3">
                    <input type="text" id="reg-name" placeholder="Full name" required
                        class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-600 focus:border-transparent outline-none">
                    <input type="email" id="reg-email" placeholder="Email" required
                        class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-600 focus:border-transparent outline-none">
                    <input type="password" id="reg-password" placeholder="Password (8+ characters)" required minlength="8"
                        class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-600 focus:border-transparent outline-none">
                </div>
                <button type="submit" class="w-full mt-4 py-2.5 bg-gray-900 text-white text-sm font-semibold rounded-full hover:bg-gray-800 transition-colors">
                    Create account
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-gray-400 mt-4">
            <a href="/" class="hover:text-gray-600">Back to BillKarma</a>
        </p>
    </div>

    <script>
    function showTab(tab) {
        document.getElementById('error-msg').classList.add('hidden');
        document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
        document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
        document.getElementById('tab-login').classList.toggle('bg-white', tab === 'login');
        document.getElementById('tab-login').classList.toggle('shadow-sm', tab === 'login');
        document.getElementById('tab-login').classList.toggle('text-gray-500', tab !== 'login');
        document.getElementById('tab-register').classList.toggle('bg-white', tab === 'register');
        document.getElementById('tab-register').classList.toggle('shadow-sm', tab === 'register');
        document.getElementById('tab-register').classList.toggle('text-gray-500', tab !== 'register');
    }

    function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg;
        el.classList.remove('hidden');
    }

    async function handleLogin(e) {
        e.preventDefault();
        try {
            const resp = await fetch('/api/advocacy/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                credentials: 'same-origin',
                body: JSON.stringify({
                    email: document.getElementById('login-email').value,
                    password: document.getElementById('login-password').value,
                }),
            });
            const data = await resp.json();
            if (resp.ok) {
                window.location.href = '/advocacy/cases';
            } else {
                showError(data.detail || 'Login failed');
            }
        } catch (err) {
            showError('Connection error. Try again.');
        }
        return false;
    }

    async function handleRegister(e) {
        e.preventDefault();
        try {
            const resp = await fetch('/api/advocacy/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                credentials: 'same-origin',
                body: JSON.stringify({
                    name: document.getElementById('reg-name').value,
                    email: document.getElementById('reg-email').value,
                    password: document.getElementById('reg-password').value,
                }),
            });
            const data = await resp.json();
            if (resp.ok) {
                window.location.href = '/advocacy/setup';
            } else {
                showError(data.detail || 'Registration failed');
            }
        } catch (err) {
            showError('Connection error. Try again.');
        }
        return false;
    }

    // Check if already logged in
    fetch('/api/advocacy/auth/me', {credentials: 'same-origin'})
        .then(r => r.json())
        .then(d => { if (d.data && d.data.user) window.location.href = '/advocacy/cases'; })
        .catch(() => {});
    </script>
</body>
</html>
