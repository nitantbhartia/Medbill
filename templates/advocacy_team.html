{% extends "advocacy_base.html" %}
{% block title %}Team{% endblock %}
{% block nav_team %}bg-gray-100 text-gray-900{% endblock %}

{% block content %}
<div class="max-w-3xl">
    <h1 class="text-2xl font-bold tracking-tight mb-6">Team</h1>

    <!-- Invite form -->
    <div class="bg-white rounded-xl border border-gray-200 p-6 mb-6">
        <h2 class="font-semibold mb-3">Invite a team member</h2>
        <form id="invite-form" onsubmit="return handleInvite(event)" class="flex items-end gap-3">
            <div class="flex-1">
                <label class="block text-sm text-gray-600 mb-1">Email</label>
                <input type="email" id="invite-email" required placeholder="advocate@example.org"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Role</label>
                <select id="invite-role" class="px-3 py-2 text-sm border border-gray-200 rounded-lg">
                    <option value="advocate">Advocate</option>
                    <option value="viewer">Viewer (read-only)</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="px-4 py-2 bg-gray-900 text-white text-sm font-medium rounded-full hover:bg-gray-800">Invite</button>
        </form>
        <div id="invite-msg" class="text-sm mt-2 hidden"></div>
    </div>

    <!-- Members list -->
    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <table class="w-full">
            <thead>
                <tr class="border-b border-gray-100 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    <th class="px-4 py-3">Name</th>
                    <th class="px-4 py-3">Email</th>
                    <th class="px-4 py-3">Role</th>
                    <th class="px-4 py-3">Status</th>
                    <th class="px-4 py-3"></th>
                </tr>
            </thead>
            <tbody id="members-tbody" class="divide-y divide-gray-50"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function loadMembers() {
    if (!currentOrg) return;
    const resp = await apiFetch(`/orgs/${currentOrg.id}/members`);
    document.getElementById('members-tbody').innerHTML = resp.data.map(m => `
        <tr>
            <td class="px-4 py-3 text-sm font-medium">${esc(m.name || '—')}</td>
            <td class="px-4 py-3 text-sm text-gray-600">${esc(m.email || m.invite_email)}</td>
            <td class="px-4 py-3"><span class="px-2 py-0.5 text-xs font-medium rounded-full ${m.role === 'admin' ? 'bg-purple-50 text-purple-700' : m.role === 'viewer' ? 'bg-blue-50 text-blue-700' : 'bg-gray-100 text-gray-700'}">${m.role}</span></td>
            <td class="px-4 py-3"><span class="text-xs ${m.status === 'active' ? 'text-green-600' : 'text-yellow-600'}">${m.status}</span></td>
            <td class="px-4 py-3 text-right">
                ${m.user_id !== currentUser.id ? `<button onclick="removeMember(${m.id})" class="text-xs text-red-500 hover:text-red-700">Remove</button>` : ''}
            </td>
        </tr>
    `).join('');
}

async function handleInvite(e) {
    e.preventDefault();
    const msg = document.getElementById('invite-msg');
    try {
        await apiFetch(`/orgs/${currentOrg.id}/members`, {
            method: 'POST',
            body: JSON.stringify({
                email: document.getElementById('invite-email').value,
                role: document.getElementById('invite-role').value,
            }),
        });
        msg.textContent = 'Invited successfully.';
        msg.className = 'text-sm mt-2 text-green-600';
        msg.classList.remove('hidden');
        document.getElementById('invite-email').value = '';
        loadMembers();
    } catch (err) {
        msg.textContent = err.message;
        msg.className = 'text-sm mt-2 text-red-600';
        msg.classList.remove('hidden');
    }
    return false;
}

async function removeMember(memberId) {
    if (!confirm('Remove this team member?')) return;
    await apiFetch(`/orgs/${currentOrg.id}/members/${memberId}`, {method: 'DELETE'});
    loadMembers();
}

function onWorkspaceReady() {
    if (!currentOrg) { window.location.href = '/advocacy/setup'; return; }
    if (currentOrg.role !== 'admin') { window.location.href = '/advocacy/cases'; return; }
    loadMembers();
}
</script>
{% endblock %}
