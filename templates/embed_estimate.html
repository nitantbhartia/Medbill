<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Bill Savings Estimator &mdash; BillKarma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: { 500: '#00824F', 600: '#00663D' },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; background: #fff; }
    </style>
</head>
<body>
<div class="max-w-md mx-auto p-5">
    <div class="mb-4">
        <p class="text-lg font-bold text-gray-900">How much could you save?</p>
        <p class="text-xs text-gray-500">Free estimate based on Medicare benchmarks</p>
    </div>

    <form id="embed-form" class="space-y-3">
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1" for="e-amount">Bill amount ($)</label>
            <input type="number" id="e-amount" required min="1" step="0.01" placeholder="e.g. 4500"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-green-600 focus:border-green-600">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1" for="e-hospital">Hospital name (optional)</label>
            <input type="text" id="e-hospital" placeholder="e.g. Memorial Regional Hospital"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-green-600 focus:border-green-600">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1" for="e-insurance">Insurance status</label>
            <select id="e-insurance" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-green-600 focus:border-green-600">
                <option value="insured">Insured (in-network)</option>
                <option value="out_of_network">Out-of-network</option>
                <option value="uninsured">Uninsured / Self-pay</option>
            </select>
        </div>
        <button type="submit" id="e-btn"
            class="w-full bg-accent-500 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-accent-600 transition">
            Estimate My Savings
        </button>
    </form>

    <div id="e-result" class="hidden mt-4"></div>

    <p class="text-center mt-4">
        <a href="{{ app_url }}/estimate" target="_blank" rel="noopener"
           class="text-xs text-gray-400 hover:text-accent-500 transition">
            Powered by BillKarma &mdash; Free bill scanning
        </a>
    </p>
</div>

<script>
function esc(s) { var t = document.createElement('span'); t.textContent = s; return t.innerHTML; }
function fmt(n) { return n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0}); }

document.getElementById('embed-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('e-btn');
    btn.disabled = true;
    btn.textContent = 'Estimating...';

    var payload = {
        bill_amount: parseFloat(document.getElementById('e-amount').value) || 0,
        hospital_name: document.getElementById('e-hospital').value,
        insurance_status: document.getElementById('e-insurance').value,
    };

    try {
        var res = await fetch('{{ api_base }}/api/estimate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Error');
        renderResult(data, payload.bill_amount);
    } catch (err) {
        var box = document.getElementById('e-result');
        box.classList.remove('hidden');
        box.innerHTML = '<div class="bg-red-50 border border-red-200 rounded-lg p-3 text-red-800 text-sm">' + esc(err.message) + '</div>';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Estimate My Savings';
    }
});

function renderResult(data, billAmount) {
    var box = document.getElementById('e-result');
    box.classList.remove('hidden');
    var html = '';

    var lo = data.estimated_savings_low;
    var hi = data.estimated_savings_high;
    if (lo > 0) {
        html += '<div class="bg-green-50 border border-green-200 rounded-lg p-5 mb-3 text-center">';
        html += '<p class="text-xs font-semibold text-green-700 mb-1">Estimated potential savings</p>';
        html += '<p class="text-2xl font-extrabold text-green-800">$' + fmt(lo) + ' &ndash; $' + fmt(hi) + '</p>';
        html += '<p class="text-xs text-green-600 mt-1">on a $' + fmt(billAmount) + ' bill</p>';
        html += '</div>';
    } else {
        html += '<div class="bg-blue-50 border border-blue-200 rounded-lg p-5 mb-3 text-center">';
        html += '<p class="text-sm font-bold text-blue-800">Your bill may be fairly priced</p>';
        html += '<p class="text-xs text-blue-600 mt-1">A full scan can catch coding errors estimates miss.</p>';
        html += '</div>';
    }

    if (data.hospital) {
        var h = data.hospital;
        html += '<div class="border border-gray-200 rounded-lg p-3 mb-3 flex items-center justify-between">';
        html += '<div class="text-sm"><span class="font-semibold text-gray-900">' + esc(h.name) + '</span>';
        if (h.city) html += '<span class="text-gray-400 text-xs ml-1">' + esc(h.city) + '</span>';
        html += '</div>';
        if (h.billing_grade) html += '<span class="text-xs font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-700">Grade ' + esc(h.billing_grade) + '</span>';
        html += '</div>';
    }

    html += '<div class="text-center">';
    html += '<a href="{{ app_url }}/scan" target="_blank" rel="noopener" class="inline-block px-5 py-2 bg-accent-500 text-white text-sm font-bold rounded-lg hover:bg-accent-600 transition">Scan My Full Bill &mdash; Free</a>';
    html += '</div>';

    box.innerHTML = html;
}
</script>
</body>
</html>
