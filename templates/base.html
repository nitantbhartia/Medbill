<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BillKarma{% endblock %}</title>
    <meta name="robots" content="{{ meta_robots if meta_robots else 'index, follow' }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ og_title if og_title else 'BillKarma' }}">
    <meta property="og:description" content="{{ og_description if og_description else 'Check medical bills against federal pricing benchmarks.' }}">
    <meta property="og:url" content="{{ canonical_url if canonical_url else request.url }}">
    <meta property="og:image" content="{{ og_image if og_image else (request.base_url|string) ~ 'static/img/billkarma-og.svg' }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: {
                            50:  '#F7FEE0',
                            100: '#F0FCC4',
                            200: '#E4F88C',
                            300: '#D8F568',
                            400: '#D2F635',
                            500: '#D2F635',
                            600: '#2D2D2D',
                            700: '#1A1A1A',
                            800: '#333333',
                            900: '#111111',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'system-ui', 'Segoe UI', 'sans-serif'],
                        mono: ['SF Mono', 'Menlo', 'Consolas', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/app.css"/>
    {% if canonical_url %}<link rel="canonical" href="{{ canonical_url }}"/>{% endif %}
    <style>
        /* === BillKarma Internal Pages — Unified Design System === */
        :root {
            --bk-canvas:    #E0E2E5;
            --bk-white:     #FFFFFF;
            --bk-black:     #1A1A1A;
            --bk-lime:      #D2F635;
            --bk-secondary: #6B7280;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            background-color: var(--bk-canvas) !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Print: restore white background */
        @media print { body { background: #fff !important; } }

        /* === NAV === */
        .bk-nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--bk-canvas);
        }

        .bk-logo {
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bk-white);
            padding: 10px 20px;
            border-radius: 100px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-decoration: none;
            color: var(--bk-black);
        }

        .bk-nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .bk-nav-link {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--bk-black);
            text-decoration: none;
            padding: 9px 18px;
            border-radius: 100px;
            transition: background 0.15s;
        }

        .bk-nav-link:hover {
            background: rgba(0, 0, 0, 0.06);
            color: var(--bk-black);
        }

        .bk-nav-cta {
            font-size: 0.875rem;
            font-weight: 700;
            background: var(--bk-black);
            color: var(--bk-white);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 100px;
            transition: transform 0.15s;
        }

        .bk-nav-cta:hover {
            transform: scale(1.04);
            color: var(--bk-white);
        }

        /* === CARDS — rounder to match landing === */
        .rounded-lg { border-radius: 20px !important; }
        .rounded-md { border-radius: 14px !important; }

        /* === PRIMARY BUTTONS — pill shape === */
        button.bg-accent-700,
        a.bg-accent-700,
        button.bg-accent-800,
        a.bg-accent-800 {
            border-radius: 100px !important;
            font-weight: 700 !important;
            letter-spacing: -0.01em;
        }

        /* === HEADINGS — tighter tracking === */
        h1 { letter-spacing: -0.025em; }
        h2 { letter-spacing: -0.02em; }

        /* === FOOTER === */
        .bk-footer {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 24px 40px;
            font-size: 0.78rem;
            color: var(--bk-secondary);
            font-weight: 500;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            margin-top: auto;
        }

        .bk-footer a {
            color: var(--bk-secondary);
            text-decoration: underline;
        }

        /* === RESPONSIVE === */
        @media (max-width: 640px) {
            .bk-nav { padding: 12px 16px; }
            .bk-logo { font-size: 1rem; padding: 8px 14px; gap: 8px; }
            .bk-nav-link { display: none; }
            .bk-footer { flex-direction: column; align-items: center; gap: 6px; padding: 20px 16px; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="text-gray-900 min-h-screen flex flex-col antialiased">

    <header>
        <nav class="bk-nav">
            <a href="/" class="bk-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                BillKarma
            </a>
            <div class="bk-nav-links">
                <a href="/hospitals/" class="bk-nav-link">Hospitals</a>
                <a href="/scan" class="bk-nav-cta">Scan a Bill</a>
            </div>
        </nav>
    </header>

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bk-footer">
        <span>&copy; 2026 BillKarma. Not medical or legal advice.</span>
        <span>Data from <a href="https://www.cms.gov" target="_blank" rel="noopener">CMS.gov</a></span>
    </footer>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
