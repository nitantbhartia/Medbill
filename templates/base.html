<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BillScan{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'system-ui', 'Segoe UI', 'sans-serif'],
                        mono: ['SF Mono', 'Menlo', 'Consolas', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/app.css"/>
    {% if canonical_url %}<link rel="canonical" href="{{ canonical_url }}"/>{% endif %}
    {% block head %}{% endblock %}
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col antialiased">

    <header class="border-b border-gray-100">
        <div class="max-w-5xl mx-auto px-5 h-14 flex items-center justify-between gap-4">
            <a href="/" class="text-lg font-semibold tracking-tight text-gray-900 no-underline">
                BillScan
            </a>
            <div class="flex items-center gap-4">
                <a href="/hospitals/"
                   class="text-sm font-medium text-gray-600 hover:text-gray-800 transition-colors">
                    Hospitals
                </a>
                <a href="/scan"
                   class="text-sm font-medium text-accent-700 hover:text-accent-800 transition-colors">
                    Scan a bill
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-gray-100 mt-auto">
        <div class="max-w-3xl mx-auto px-5 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-gray-400">
            <span>&copy; 2026 BillScan. Not medical or legal advice.</span>
            <span>Data from <a href="https://www.cms.gov" target="_blank" rel="noopener" class="underline hover:text-gray-600">CMS.gov</a></span>
        </div>
    </footer>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
