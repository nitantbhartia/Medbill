{% extends "advocacy_base.html" %}
{% block title %}Setup Organization{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <h1 class="text-2xl font-bold tracking-tight mb-2">Create your organization</h1>
    <p class="text-gray-500 text-sm mb-6">Set up your advocacy workspace to start managing cases.</p>

    <form id="setup-form" onsubmit="return handleSetup(event)" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Organization name</label>
            <input type="text" id="org-name" required placeholder="e.g., Community Patient Advocates"
                class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-600 focus:border-transparent outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contact email</label>
            <input type="email" id="org-email" required
                class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-600 focus:border-transparent outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Organization type</label>
            <select id="org-type" class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-600 focus:border-transparent outline-none">
                <option value="nonprofit">Nonprofit</option>
                <option value="community">Community organization</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div id="setup-error" class="hidden p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg"></div>
        <button type="submit" class="w-full py-2.5 bg-gray-900 text-white text-sm font-semibold rounded-full hover:bg-gray-800 transition-colors">
            Create workspace
        </button>
    </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
async function handleSetup(e) {
    e.preventDefault();
    try {
        const resp = await apiFetch('/orgs', {
            method: 'POST',
            body: JSON.stringify({
                name: document.getElementById('org-name').value,
                contact_email: document.getElementById('org-email').value,
                org_type: document.getElementById('org-type').value,
            }),
        });
        if (resp && resp.data) {
            localStorage.setItem('bk_org_id', resp.data.id);
            window.location.href = '/advocacy/cases';
        }
    } catch (err) {
        const el = document.getElementById('setup-error');
        el.textContent = err.message;
        el.classList.remove('hidden');
    }
    return false;
}

function onWorkspaceReady() {
    if (userOrgs.length > 0) {
        window.location.href = '/advocacy/cases';
    }
    if (currentUser) {
        document.getElementById('org-email').value = currentUser.email;
    }
}
</script>
{% endblock %}
