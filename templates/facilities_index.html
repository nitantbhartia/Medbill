{% extends "base.html" %}

{% block title %}{{ title }} | BillKarma{% endblock %}

{% block content %}
<section class="max-w-5xl mx-auto px-5 py-10">
    <h1 class="text-3xl font-bold text-gray-900 mb-2">{{ title }}</h1>
    <p class="text-gray-600 mb-6">Browse {{ label.lower() }} by state.</p>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        {% for row in states %}
        <a href="{{ base_path }}{{ row.state_slug }}/" class="rounded border border-gray-200 bg-white p-3 hover:bg-gray-50">
            <div class="font-semibold text-gray-800">{{ row.state }}</div>
            <div class="text-xs text-gray-500">{{ row.facilities }} facilities</div>
        </a>
        {% endfor %}
    </div>
</section>
{% endblock %}
